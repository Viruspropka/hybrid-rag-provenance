[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hybrid-rag-provenance"
version = "0.1.0"
description = "Hybrid retrieval (dense + FTS5 + reciprocal-rank fusion) with provenance ranking over markdown notes"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alexey Berezka" }]
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
models = ["sentence-transformers>=3.0"]
flashrank = ["flashrank>=0.2"]
memory = ["psutil>=5.9"]
dev = ["pytest>=8"]

[project.scripts]
hrag = "hybrid_rag.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
hybrid_rag = ["sample_vault/*.md", "sample_vault/**/*.md"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
